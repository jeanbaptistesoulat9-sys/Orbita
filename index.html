<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#03060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GAÏA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#03060d;--panel:rgba(10,16,28,.82);--line:rgba(255,255,255,.08);--txt:#e8eefc;--dim:#8794b0;--acc:#4fd1ff;--ok:#3ddc97;--warn:#ffb020;--bad:#ff4d5e;--gold:#ffd166}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:14px;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#city{display:none}
.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:14px}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
/* top */
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;z-index:10;pointer-events:none}
#top>*{pointer-events:auto}
.logo{padding:10px 14px;font-weight:800;letter-spacing:.28em;font-size:13px}
.logo b{color:var(--acc)}
#clock{padding:8px 14px;min-width:200px}
#date{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
#sub{color:var(--dim);font-size:11.5px;margin-top:2px}
#speeds{display:flex;padding:4px;gap:2px;overflow-x:auto;scrollbar-width:none}
#speeds::-webkit-scrollbar{display:none}
#speeds button{padding:8px 10px;border-radius:10px;font-size:12px;font-weight:600;color:var(--dim);white-space:nowrap}
#speeds button.on{background:rgba(79,209,255,.15);color:var(--acc)}
.sp{flex:1}
#menuBtn{padding:10px 14px;font-weight:600;font-size:13px}
/* world stats */
#world{position:fixed;top:76px;left:12px;z-index:9;padding:12px 14px;width:250px}
.ws{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}
.ws span:first-child{color:var(--dim)}
.ws b{font-variant-numeric:tabular-nums}
#crisisChips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,77,94,.15);color:#ff98a2;border:1px solid rgba(255,77,94,.3)}
.chip.g{background:rgba(61,220,151,.12);color:#8ff0c4;border-color:rgba(61,220,151,.3)}
/* crumbs */
#crumbs{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:13px;white-space:nowrap}
#crumbs button{padding:5px 9px;border-radius:8px;font-weight:600}
#crumbs button:hover{background:rgba(255,255,255,.06)}
#crumbs .cur{color:var(--acc)}
#crumbs i{color:#445;font-style:normal}
/* layers */
#layers{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:4px;padding:5px;max-width:calc(100vw - 420px);overflow-x:auto;scrollbar-width:none}
#layers::-webkit-scrollbar{display:none}
#layers button{padding:7px 11px;border-radius:9px;font-size:12px;font-weight:600;color:var(--dim);white-space:nowrap}
#layers button.on{background:rgba(255,255,255,.1);color:var(--txt)}
#legend{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);z-index:8;font-size:11px;color:var(--dim);display:flex;align-items:center;gap:8px;pointer-events:none}
#legend .bar{width:160px;height:6px;border-radius:3px}
/* panel */
#panel{position:fixed;top:76px;right:12px;bottom:12px;width:370px;z-index:9;display:flex;flex-direction:column;overflow:hidden}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;padding:12px 0;font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.04em;position:relative}
#tabs button.on{color:var(--txt)}
#tabs button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:2px;background:var(--acc);border-radius:2px}
#tabs .badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;margin-left:4px;line-height:16px}
#pbody{flex:1;overflow-y:auto;padding:14px;scrollbar-width:thin;scrollbar-color:#2a3448 transparent}
h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
h3{font-size:11px;letter-spacing:.14em;color:var(--dim);margin:16px 0 8px;font-weight:700}
.muted{color:var(--dim);font-size:12.5px;line-height:1.45}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.kv div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv small{display:block;color:var(--dim);font-size:11px}
.kv b{font-size:15px;font-variant-numeric:tabular-nums}
.bar2{margin:7px 0}
.bar2 .t{display:flex;justify-content:space-between;font-size:12px}
.bar2 .t span:first-child{color:var(--dim)}
.bar2 .b{height:6px;background:rgba(255,255,255,.06);border-radius:3px;margin-top:4px;overflow:hidden}
.bar2 .b i{display:block;height:100%;border-radius:3px;transition:width .4s}
.btn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);text-align:left;margin-bottom:6px;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.06)}
.btn .i{font-size:20px;width:30px;text-align:center;flex-shrink:0}
.btn .n{font-weight:700;font-size:13.5px}
.btn .d{color:var(--dim);font-size:11.8px;margin-top:1px;line-height:1.35}
.btn .r{margin-left:auto;flex-shrink:0}
.btn.on{border-color:rgba(79,209,255,.5);background:rgba(79,209,255,.08)}
.tg{width:38px;height:22px;border-radius:11px;background:#28324a;position:relative;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.on .tg{background:var(--acc)}
.on .tg::after{transform:translateX(16px)}
.tg.half{background:linear-gradient(90deg,var(--acc) 50%,#28324a 50%)}
.scope{display:flex;gap:6px;margin-bottom:10px}
.scope button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--dim)}
.scope button.on{border-color:var(--acc);color:var(--acc);background:rgba(79,209,255,.08)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cgrid .btn{flex-direction:column;align-items:flex-start;gap:4px;margin:0}
.cgrid .btn:hover{border-color:rgba(255,77,94,.5)}
.alert{display:flex;gap:10px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px;cursor:pointer;background:rgba(255,255,255,.02)}
.alert:hover{background:rgba(255,255,255,.05)}
.alert .i{font-size:18px}
.alert .x{font-size:12.8px;line-height:1.4}
.alert .w{color:var(--dim);font-size:11px;margin-top:2px}
.alert.l2{border-color:rgba(255,77,94,.35);background:rgba(255,77,94,.06)}
.alert.l1{border-color:rgba(255,176,32,.25)}
.alert.l3{border-color:rgba(61,220,151,.35);background:rgba(61,220,151,.06)}
.cityb{display:flex;justify-content:space-between;align-items:center;width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);margin-bottom:5px;font-size:13px;font-weight:600}
.cityb:hover{border-color:var(--acc)}
.cityb span{color:var(--acc);font-size:12px}
.spark{width:100%;height:46px;display:block;margin-top:4px}
/* feed (desktop) */
#feed{position:fixed;left:12px;bottom:12px;width:330px;z-index:8;display:flex;flex-direction:column-reverse;gap:6px;pointer-events:none}
#feed .alert{pointer-events:auto;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:fin .35s ease-out;margin:0}
@keyframes fin{from{opacity:0;transform:translateY(10px)}}
/* big toast */
#bigt{position:fixed;top:130px;left:50%;transform:translateX(-50%);z-index:12;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
.bt{background:rgba(60,8,16,.9);border:1px solid rgba(255,77,94,.6);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;animation:fin .3s;box-shadow:0 10px 40px rgba(255,40,60,.25);max-width:min(560px,92vw);text-align:center}
.bt.g{background:rgba(8,40,28,.92);border-color:rgba(61,220,151,.6);box-shadow:0 10px 40px rgba(61,220,151,.2)}
/* city hud */
#chud{position:fixed;top:76px;left:12px;z-index:9;width:250px;padding:12px 14px;display:none}
#chud h2{font-size:18px}
.ind{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}
.ind div{font-size:12px;background:rgba(255,255,255,.04);border-radius:8px;padding:6px 8px}
.ind b{display:block;font-size:14px}
#cnews{margin-top:10px;font-size:12px;line-height:1.5;color:#c7d0e6}
#cnews div{padding:3px 0;border-top:1px solid var(--line)}
#pcard{position:fixed;z-index:13;width:240px;padding:12px 14px;display:none;pointer-events:none}
#pcard b{font-size:14px}
#pcard .q{margin-top:8px;font-style:italic;color:#dfe6ff}
#zoomHint{position:fixed;top:124px;left:50%;transform:translateX(-50%);z-index:8;color:var(--dim);font-size:12px;pointer-events:none;text-align:center}
/* mars */
#mars{position:fixed;right:396px;bottom:14px;z-index:8;padding:8px 12px;display:none;align-items:center;gap:10px;font-size:12px}
#mars .pl{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f4a072,#b4462a 60%,#5a1c10);box-shadow:0 0 14px rgba(255,120,60,.5)}
/* modal */
#modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(3,6,13,.55),rgba(3,6,13,.92));padding:16px}
#modal .card{max-width:720px;width:100%;padding:28px;max-height:92vh;overflow-y:auto}
#modal h1{font-size:44px;font-weight:800;letter-spacing:.18em}
#modal h1 b{color:var(--acc)}
#modal .lead{color:var(--dim);margin:8px 0 18px;line-height:1.5}
.scen{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.scen .btn{flex-direction:column;align-items:flex-start;margin:0;padding:14px}
.scen .btn:hover{border-color:var(--acc)}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:var(--bg);color:var(--dim);font-size:14px;letter-spacing:.1em}
@media (max-width:820px){
  #top{top:8px;left:8px;right:8px;gap:6px;flex-wrap:wrap}
  .logo{display:none}
  #clock{min-width:0;padding:7px 11px}
  #date{font-size:13px}
  #speeds{order:3;width:100%;flex:none}
  .sp{display:none}
  #menuBtn{margin-left:auto}
  #world{top:150px;left:8px;right:8px;width:auto;padding:0;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none}
  #world .ws{display:none}
  #crumbs{top:108px;left:8px;transform:none;font-size:12px;max-width:calc(100vw - 16px);overflow-x:auto}
  #bigt{top:auto;bottom:calc(44vh + 56px)}
  .bt{font-size:12.5px;padding:8px 12px}
  #zoomHint{display:none}
  .scen{grid-template-columns:1fr 1fr}
  .scen .btn{padding:10px}
  #modal .card{padding:18px}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:44vh;border-radius:16px 16px 0 0;transition:height .25s}
  #panel.min{height:auto}
  #panel.min #pbody{display:none}
  #layers{bottom:calc(44vh + 8px);max-width:calc(100vw - 16px);left:auto;right:8px;transform:none}
  #legend{display:none}
  #feed{display:none}
  #chud{top:150px;left:8px;right:8px;width:auto;padding:8px 10px}
  #chud h2{font-size:15px}
  #chud .hideM{display:none}
  .ind{grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
  .ind div{font-size:10.5px;padding:4px 6px}
  .ind b{font-size:12px}
  #zoomHint{bottom:calc(44vh + 56px)}
  #mars{right:8px;bottom:auto;top:150px}
  #modal h1{font-size:30px}
}
</style>
</head>

  showMenu(true);requestAnimationFrame(t=>{last=t;loop(t)});
}).catch(e=>{$('#loading').textContent='Impossible de charger la carte du monde. Vérifie ta connexion puis recharge la page.';console.error(e);});
})();
</script>
