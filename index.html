<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#04050b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ORBITA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04050b; --panel:rgba(12,14,28,.74); --line:rgba(255,255,255,.08);
  --txt:#eef0ff; --dim:#8b90b8; --acc:#7cf3ff; --acc2:#ff8a3d; --gold:#ffd24a; --ok:#5dffa8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'Space Grotesk',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#hud{position:fixed;top:0;left:0;right:0;padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
.brand{font-weight:700;letter-spacing:.35em;font-size:13px;color:var(--dim)}
.brand b{color:var(--acc)}
#money{font-size:clamp(30px,6vw,52px);font-weight:700;line-height:1;margin-top:6px;text-shadow:0 0 24px rgba(124,243,255,.3);font-variant-numeric:tabular-nums}
#money small{font-size:.45em;color:var(--acc);margin-left:6px}
#rate{color:var(--dim);font-size:14px;margin-top:6px;font-variant-numeric:tabular-nums}
#rate b{color:var(--ok)}
.right{text-align:right;pointer-events:auto}
.pill{display:inline-flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:7px 14px;font-size:13px;margin-left:6px;margin-bottom:6px}
.pill .k{color:var(--dim)}
button.pill{color:var(--txt);cursor:pointer;font-family:inherit}
button.pill.on{border-color:rgba(93,255,168,.5);color:var(--ok)}
#combo{position:fixed;left:50%;top:18%;transform:translate(-50%,-50%);font-weight:700;font-size:clamp(28px,7vw,64px);pointer-events:none;z-index:4;opacity:0;letter-spacing:.04em;transition:opacity .25s;background:linear-gradient(90deg,var(--acc),#fff,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
#boost{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:5;pointer-events:none;display:flex;gap:8px}
.bchip{background:linear-gradient(90deg,rgba(255,210,74,.18),rgba(255,138,61,.18));border:1px solid rgba(255,210,74,.5);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--gold)}
#panel{position:fixed;right:16px;top:110px;bottom:16px;width:340px;z-index:6;display:flex;flex-direction:column;gap:10px;pointer-events:none}
#tabs{display:flex;gap:6px;pointer-events:auto}
#tabs button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:10px 0;border-radius:12px;font-family:inherit;font-weight:700;font-size:12px;letter-spacing:.12em;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#tabs button.on{color:var(--txt);border-color:rgba(124,243,255,.45)}
#list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;pointer-events:auto;padding-right:2px;scrollbar-width:thin;scrollbar-color:#333 transparent}
.up,.stat,.bang,.atl{flex-shrink:0}
.up{position:relative;display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .08s,border-color .2s,opacity .2s}
.up:active{transform:scale(.98)}
.up.no{opacity:.45}
.up.can{border-color:rgba(93,255,168,.4)}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.05)}
.nm{font-weight:700;font-size:14px}
.nm span{color:var(--dim);font-weight:500;font-size:12px;margin-left:4px}
.ds{color:var(--dim);font-size:12px;margin-top:2px;line-height:1.3}
.cost{font-weight:700;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.cost.star{color:var(--gold)}
.bang{background:linear-gradient(135deg,rgba(255,138,61,.22),rgba(124,243,255,.14));border:1px solid rgba(255,138,61,.5);border-radius:16px;padding:16px;text-align:center}
.bang h3{letter-spacing:.2em;font-size:15px}
.bang p{color:var(--dim);font-size:12.5px;margin:8px 0 12px;line-height:1.45}
.bang button{width:100%;padding:13px;border-radius:12px;border:0;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;background:linear-gradient(90deg,var(--acc2),var(--gold));color:#140a02}
.bang button:disabled{filter:grayscale(1);opacity:.4;cursor:not-allowed}
.stat{display:flex;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px}
.stat span:first-child{color:var(--dim)}
.atl{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px}
.atl img,.atl .unk{width:48px;height:48px;object-fit:contain}
.atl .unk{display:grid;place-items:center;color:#333;font-size:24px}
.atl .d{color:var(--dim);font-size:11.5px;line-height:1.3;margin-top:2px}
.atl .v{color:var(--dim);font-size:12px;text-align:right}
#toasts{position:fixed;left:20px;bottom:20px;z-index:7;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(380px,calc(100vw - 40px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 14px;border-radius:10px;font-size:13px;animation:tin .35s ease-out;line-height:1.4}
.toast b{color:var(--acc)}
.toast i{color:var(--dim);font-style:normal;font-size:12px;display:block}
@keyframes tin{from{transform:translateX(-20px);opacity:0}}
#hint{position:fixed;left:50%;bottom:12%;transform:translateX(-50%);color:var(--dim);font-size:14px;letter-spacing:.08em;pointer-events:none;z-index:3;text-align:center;transition:opacity 1s;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
#modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(3,4,10,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#modal .card{background:#0d0f1e;border:1px solid var(--line);border-radius:20px;padding:28px;max-width:380px;width:calc(100% - 32px);text-align:center}
#modal h2{letter-spacing:.15em;font-size:18px}
#modal .big{font-size:38px;font-weight:700;color:var(--ok);margin:14px 0}
#modal p{color:var(--dim);font-size:14px}
#modal button{margin-top:18px;padding:12px 28px;border-radius:12px;border:0;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;background:var(--acc);color:#08091a}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15;transition:opacity 1.2s}
@media (max-width:760px){
  #hud{padding:12px 14px}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;height:42vh;padding:0 10px 10px;transition:height .3s}
  #panel.min{height:52px}
  #panel.min #list{display:none}
  #combo{top:24%}
  #boost{top:auto;bottom:calc(42vh + 10px)}
  #toasts{left:12px;bottom:auto;top:120px}
  #hint{bottom:calc(42vh + 60px);font-size:12px;width:90%}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div>
    <div class="brand">◉ <b>ORBITA</b></div>
    <div id="money">0<small>⚡</small></div>
    <div id="rate"><b>+0</b>/s · 0 corps</div>
  </div>
  <div class="right">
    <span class="pill"><span class="k">✦</span><span id="dust">0</span></span>
    <span class="pill"><span class="k">ÈRE</span><span id="era">1</span></span>
    <button class="pill" id="eco" title="Mode éco : moins de batterie">🌿</button>
    <button class="pill" id="mute">🔊</button>
  </div>
</div>
<div id="boost"></div>
<div id="combo"></div>
<div id="hint">Touche ou maintiens pour créer de la matière · Glisse pour la lancer<br>Deux corps identiques fusionnent ⟶ poussière, astéroïde, lune, planète, étoile…</div>
<div id="panel">
  <div id="tabs">
    <button data-t="up" class="on">FORGE</button>
    <button data-t="star">COSMOS</button>
    <button data-t="stats">ATLAS</button>
  </div>
  <div id="list"></div>
</div>
<div id="toasts"></div>
<div id="flash"></div>
<div id="modal"><div class="card"><h2>BON RETOUR</h2><div class="big" id="mb"></div><p id="mp"></p><button id="mok">Récolter</button></div></div>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
/* ================= utils ================= */
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','UDc','DDc','TDc','QaDc','QiDc','SxDc','SpDc','OcDc','NoDc','Vg'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n<1000) return n<10&&n%1? n.toFixed(1) : Math.floor(n).toString();
  const e=Math.floor(Math.log10(n)/3);let s;
  if(e<SUF.length) s=SUF[e];
  else{const k=e-SUF.length;if(k>=676)return n.toExponential(2).replace('+','');s=String.fromCharCode(97+Math.floor(k/26))+String.fromCharCode(97+k%26);}
  const v=n/Math.pow(1000,e);
  return (v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v))+s;
}
const rnd=(a,b)=>a+Math.random()*(b-a);
const safe=v=>isFinite(v)?Math.min(v,1e306):1e306;
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= catalogue des corps ================= */
// k: peintre · sh: ombre dynamique (éclairé par le noyau) · lum: lumineux · spin: tourne sur lui-même · m: marge du sprite
const TYPES=[
 {n:'Poussière cosmique',k:'dust',spin:1,m:1.3,d:'Des grains plus fins que le sable. Tout commence ici.'},
 {n:'Gravillon',k:'pebble',spin:1,m:1.1,d:'Un caillou spatial de la taille d’un poing.'},
 {n:'Débris',k:'debris',spin:1,m:1.15,d:'Éclat métallique arraché à un corps plus gros.'},
 {n:'Météoroïde',k:'meteoroid',spin:1,m:1.1,d:'S’il touchait une atmosphère, ce serait une étoile filante.'},
 {n:'Astéroïde',k:'asteroid',spin:1,m:1.1,d:'Roche criblée de cratères, vieille de 4 milliards d’années.'},
 {n:'Comète',k:'comet',m:2.2,tail:1,d:'Glace sale. Sa queue pointe toujours à l’opposé du noyau.'},
 {n:'Planète naine',k:'dwarf',sh:1,m:1.05,d:'Assez grosse pour être ronde, pas assez pour faire le ménage.'},
 {n:'Lune',k:'moon',sh:1,m:1.05,d:'Mers de basalte et cratères d’impact.'},
 {n:'Lune glacée',k:'icemoon',sh:1,m:1.05,d:'Sous la croûte de glace, un océan liquide ?'},
 {n:'Monde volcanique',k:'volcanic',sh:1,m:1.05,d:'Des volcans de soufre crachent à 300 km d’altitude.'},
 {n:'Planète désertique',k:'desert',sh:1,m:1.2,d:'Poussière d’oxyde de fer et calottes de glace.'},
 {n:'Planète océan',k:'ocean',sh:1,m:1.25,d:'Un seul océan, profond de centaines de kilomètres.'},
 {n:'Planète tellurique',k:'terran',sh:1,m:1.25,d:'Continents, nuages, océans… la vie est possible.'},
 {n:'Géante de glace',k:'icegiant',sh:1,m:1.2,d:'Méthane bleu et vents à 2 000 km/h.'},
 {n:'Géante gazeuse',k:'gasgiant',sh:1,m:1.15,d:'Des bandes de nuages et une tempête plus grande qu’un monde.'},
 {n:'Géante à anneaux',k:'ringed',sh:1,m:2.3,d:'Ses anneaux sont faits de milliards de blocs de glace.'},
 {n:'Naine brune',k:'browndwarf',lum:1,m:1.8,d:'Une étoile ratée qui rougeoie encore.'},
 {n:'Naine rouge',k:'reddwarf',lum:1,m:2.6,d:'Petite, froide, elle brillera mille milliards d’années.'},
 {n:'Étoile jaune',k:'sun',lum:1,m:2.8,d:'Un soleil. 600 millions de tonnes d’hydrogène fusionnées par seconde.'},
 {n:'Étoile bleue',k:'bluestar',lum:1,m:3,d:'Massive et brûlante : 30 000 °C en surface.'},
 {n:'Géante rouge',k:'redgiant',lum:1,m:2.1,d:'Une étoile en fin de vie, gonflée à 100 fois sa taille.'},
 {n:'Naine blanche',k:'whitedwarf',lum:1,m:3,d:'Le cœur d’une étoile morte : une cuillère pèse une tonne.'},
 {n:'Pulsar',k:'pulsar',lum:1,m:3,beam:1,d:'Tourne 700 fois par seconde en balayant l’espace.'},
 {n:'Magnétar',k:'magnetar',lum:1,m:2.6,beam:1,d:'Le champ magnétique le plus puissant de l’Univers.'},
 {n:'Trou noir',k:'blackhole',lum:1,m:2.6,d:'Même la lumière ne s’en échappe pas.'},
 {n:'Nébuleuse',k:'nebula',lum:1,m:1.7,d:'Pouponnière d’étoiles en gaz ionisé.'},
 {n:'Amas stellaire',k:'cluster',lum:1,m:1.5,d:'Des milliers d’étoiles nées ensemble.'},
 {n:'Galaxie spirale',k:'spiral',lum:1,spin:1,m:1.6,d:'200 milliards d’étoiles en bras tourbillonnants.'},
 {n:'Galaxie elliptique',k:'elliptical',lum:1,m:1.5,d:'Vieille, ronde, pleine d’étoiles rouges.'},
 {n:'Quasar',k:'quasar',lum:1,m:3,d:'Un trou noir qui dévore : plus brillant qu’une galaxie.'},
 {n:'Amas de galaxies',k:'galcluster',lum:1,m:1.7,d:'Des centaines de galaxies liées par la gravité.'},
];
const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
const HYP0=17,HYPN=TYPES.length-HYP0;
function typeOf(t){
  if(t<TYPES.length)return TYPES[t];
  const k=t-TYPES.length,c=Math.floor(k/HYPN),b=TYPES[HYP0+k%HYPN];
  return Object.assign({},b,{n:'Hyper-'+b.n+' '+(c<10?ROMAN[c]:c+1),hs:[18,-14,170,-28,30][c%5],d:'Une version exotique d’un autre cycle cosmique.'});
}
const tierName=t=>typeOf(t).n;
const tierVal=t=>Math.pow(3,t);
const tierSize=t=>Math.min(36,4.5+Math.sqrt(t)*3.6);

/* ================= peinture procédurale (une seule fois par sprite) ================= */
let HS=0;
const hsl=(h,s,l,a=1)=>`hsla(${((h+HS)%360+360)%360},${s}%,${l}%,${a})`;
const T0='rgba(0,0,0,0)';
function circ(g,x,y,r){g.beginPath();g.arc(x,y,Math.max(.01,r),0,TAU);}
function rg(g,x,y,r0,r1,st){const gr=g.createRadialGradient(x,y,r0,x,y,r1);for(const[o,c]of st)gr.addColorStop(o,c);return gr;}
function glow(g,r0,r1,c){g.fillStyle=rg(g,0,0,r0,r1,[[0,c],[1,T0]]);circ(g,0,0,r1);g.fill();}
function speckle(g,q,n,R,s0,s1,col){for(let i=0;i<n;i++){const a=q()*TAU,d=Math.sqrt(q())*R;g.fillStyle=col(q);circ(g,Math.cos(a)*d,Math.sin(a)*d,s0+q()*(s1-s0));g.fill();}}
function craters(g,q,n,R,s0,s1,dark,light){
  for(let i=0;i<n;i++){const a=q()*TAU,d=Math.sqrt(q())*R*.85,x=Math.cos(a)*d,y=Math.sin(a)*d,s=s0+q()*q()*(s1-s0);
    g.fillStyle=light;circ(g,x+s*.12,y+s*.12,s*1.05);g.fill();
    g.fillStyle=dark;circ(g,x-s*.08,y-s*.08,s*.88);g.fill();}
}
function limb(g,r,a){g.fillStyle=rg(g,0,0,r*.55,r,[[0,T0],[1,`rgba(0,0,0,${a})`]]);circ(g,0,0,r);g.fill();}
function sphere(g,r,paint,o={}){
  if(o.atmo){g.fillStyle=rg(g,0,0,r*.9,r*(1+o.aw),[[0,o.atmo],[1,T0]]);circ(g,0,0,r*(1+o.aw));g.fill();}
  g.save();circ(g,0,0,r);g.clip();paint();limb(g,r,o.limb??.45);g.restore();
  if(o.atmo){g.strokeStyle=o.atmo;g.lineWidth=r*.05;circ(g,0,0,r*.99);g.stroke();}
}
function bands(g,q,r,cols,n,wob){
  let y=-r;const hs=[];let tot=0;for(let i=0;i<n;i++){const h=.4+q();hs.push(h);tot+=h;}
  for(let i=0;i<n;i++){const h=hs[i]/tot*2*r,ph=q()*TAU,f=2+q()*4,w=wob*(.3+q());
    g.fillStyle=cols[Math.floor(q()*cols.length)];g.beginPath();
    for(let x=-r;x<=r+.1;x+=r/10)g.lineTo(x,y+Math.sin(x/r*f+ph)*w);
    for(let x=r;x>=-r-.1;x-=r/10)g.lineTo(x,y+h+Math.sin(x/r*f+ph+1)*w+1);
    g.fill();y+=h;}
}
function rockPath(q,r,pts,rough,angular){
  const P=[];for(let i=0;i<pts;i++){const a=i/pts*TAU+(q()-.5)*.3,d=r*(1-rough*q());P.push([Math.cos(a)*d,Math.sin(a)*d]);}
  const p=new Path2D();
  if(angular){p.moveTo(P[0][0],P[0][1]);for(let i=1;i<pts;i++)p.lineTo(P[i][0],P[i][1]);p.closePath();return p;}
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];let m=mid(P[pts-1],P[0]);p.moveTo(m[0],m[1]);
  for(let i=0;i<pts;i++){m=mid(P[i],P[(i+1)%pts]);p.quadraticCurveTo(P[i][0],P[i][1],m[0],m[1]);}
  p.closePath();return p;
}
function rock(g,q,r,o){
  const p=rockPath(q,r,o.pts||16,o.rough||.25,o.ang);
  const lg=g.createLinearGradient(-r,-r,r,r);
  lg.addColorStop(0,hsl(o.h,o.s,o.l+18));lg.addColorStop(.5,hsl(o.h,o.s,o.l));lg.addColorStop(1,hsl(o.h,o.s,Math.max(4,o.l-20)));
  g.fillStyle=lg;g.fill(p);g.save();g.clip(p);
  speckle(g,q,o.sp??40,r,r*.03,r*.12,q=>hsl(o.h,o.s,o.l+(q()-.5)*30,.35));
  if(o.cr)craters(g,q,o.cr,r,r*.06,r*.26,hsl(o.h,o.s,Math.max(3,o.l-14),.75),hsl(o.h,o.s,o.l+14,.5));
  if(o.ice)speckle(g,q,o.ice,r*.8,r*.06,r*.22,()=>'rgba(235,245,255,.75)');
  if(o.metal){g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=r*.07;g.beginPath();g.moveTo(-r*.6,-r*.2);g.lineTo(r*.3,-r*.55);g.stroke();
    g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=r*.05;for(let i=0;i<3;i++){g.beginPath();const y=(q()-.5)*r;g.moveTo(-r,y);g.lineTo(r,y+(q()-.5)*r*.6);g.stroke();}}
  g.fillStyle=rg(g,-r*.45,-r*.45,0,r*2.1,[[0,T0],[.45,'rgba(0,0,0,.15)'],[1,'rgba(0,0,0,.8)']]);g.fill(p);
  g.restore();
}
function star(g,q,r,o){
  glow(g,r*.6,r*o.gr,o.gc);
  glow(g,r*.9,r*1.5,o.gc2||o.gc);
  sphere(g,r,()=>{
    g.fillStyle=rg(g,0,0,0,r,[[0,o.c0],[.55,o.c1],[1,o.c2]]);g.fillRect(-r,-r,2*r,2*r);
    speckle(g,q,o.gn||140,r,r*(o.g0||.04),r*(o.g1||.1),q=>q()<.5?'rgba(255,255,255,.09)':'rgba(90,20,0,.1)');
    for(let i=0;i<(o.spots||0);i++){const a=q()*TAU,d=q()*r*.6;g.fillStyle='rgba(60,15,0,.55)';circ(g,Math.cos(a)*d,Math.sin(a)*d,r*(.04+q()*.06));g.fill();}
  },{limb:o.limb??.35});
}
function bh(g,r,h,full){
  glow(g,r,r*2.6,hsl(h,100,55,.25));
  g.save();g.rotate(-.18);
  const disk=(clipFront)=>{g.save();if(clipFront){g.beginPath();g.rect(-r*4,-r*.02,r*8,r*4);g.clip();}

/* ================= sprites en cache ================= */
let Q=1;
const sprites=new Map();
function getSprite(t,v){
  const key=t*8+v;let s=sprites.get(key);if(s)return s;
  const T=typeOf(t),r=tierSize(t),half=r*(T.m||1.15),px=Math.max(4,Math.ceil(half*2*Q));
  const cv=document.createElement('canvas');cv.width=cv.height=px;
  const g=cv.getContext('2d');g.scale(px/(half*2),px/(half*2));g.translate(half,half);
  HS=T.hs||0;PAINT[T.k](g,mul(key*7919+13),r,v);HS=0;
  s={cv,half,T};sprites.set(key,s);return s;
}
const shadows=new Map();
function getShadow(r){const k=Math.round(r*4);let s=shadows.get(k);if(s)return s;
  const px=Math.ceil(r*2*Q)+2,cv=document.createElement('canvas');cv.width=cv.height=px;const g=cv.getContext('2d');g.scale(px/(r*2),px/(r*2));g.translate(r,r);
  const lg=g.createLinearGradient(-r,0,r,0);lg.addColorStop(0,T0);lg.addColorStop(.45,'rgba(0,0,0,.08)');lg.addColorStop(.68,'rgba(0,0,0,.7)');lg.addColorStop(1,'rgba(0,0,0,.9)');
  g.fillStyle=lg;circ(g,0,0,r*1.005);g.fill();s={cv,r};shadows.set(k,s);return s;}
let FX={};
function makeFX(){
  // queue de comète (pointe vers +x)
  let cv=document.createElement('canvas'),L=120,Hh=30;cv.width=L*Q;cv.height=Hh*Q;let g=cv.getContext('2d');g.scale(Q,Q);
  let lg=g.createLinearGradient(0,0,L,0);lg.addColorStop(0,'rgba(170,220,255,.55)');lg.addColorStop(1,T0);g.fillStyle=lg;
  g.beginPath();g.moveTo(0,Hh/2-3);g.lineTo(L,Hh/2-1);g.lineTo(L,Hh/2+1);g.lineTo(0,Hh/2+3);g.fill();
  lg=g.createLinearGradient(0,0,L*.7,0);lg.addColorStop(0,'rgba(255,235,200,.4)');lg.addColorStop(1,T0);g.fillStyle=lg;
  g.beginPath();g.moveTo(0,Hh/2-4);g.quadraticCurveTo(L*.4,Hh/2,L*.7,Hh-2);g.lineTo(L*.7,Hh);g.quadraticCurveTo(L*.35,Hh/2+8,0,Hh/2+4);g.fill();
  FX.tail={cv,L,H:Hh};
  // faisceaux de pulsar
  cv=document.createElement('canvas');L=110;cv.width=L*2*Q;cv.height=24*Q;g=cv.getContext('2d');g.scale(Q,Q);g.translate(L,12);
  for(const s of[-1,1]){lg=g.createLinearGradient(0,0,s*L,0);lg.addColorStop(0,'rgba(190,230,255,.7)');lg.addColorStop(1,T0);g.fillStyle=lg;g.beginPath();g.moveTo(0,-1);g.lineTo(s*L,-10);g.lineTo(s*L,10);g.lineTo(0,1);g.fill();}
  FX.beam={cv,L};
  // éclat de rareté
  cv=document.createElement('canvas');cv.width=cv.height=32*Q;g=cv.getContext('2d');g.scale(Q,Q);g.translate(16,16);g.fillStyle='rgba(255,225,120,.95)';
  g.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,d=i%2?3:15;g.lineTo(Math.cos(a)*d,Math.sin(a)*d);}g.fill();FX.spark={cv};
}

  GM=.2*ORB*ORB*ORB;

}
function makeBG(){
  bg=document.createElement('canvas');bg.width=cv.width;bg.height=cv.height;const g=bg.getContext('2d');g.scale(DPR,DPR);
  const q=mul(1234+S.era);
  g.fillStyle='#04050b';g.fillRect(0,0,W,H);
  // voie lactée
  g.save();g.translate(W/2,H/2);g.rotate(-.5);const L=Math.hypot(W,H);
  let gr=g.createLinearGradient(0,-H*.35,0,H*.35);gr.addColorStop(0,T0);gr.addColorStop(.5,'rgba(140,130,170,.10)');gr.addColorStop(1,T0);g.fillStyle=gr;g.fillRect(-L/2,-H*.35,L,H*.7);
  for(let i=0;i<70;i++){const x=(q()-.5)*L,y=(q()+q()-1)*H*.15,s=40+q()*140;g.fillStyle=rg(g,x,y,0,s,[[0,`hsla(${q()<.5?30:220},40%,60%,.05)`],[1,T0]]);circ(g,x,y,s);g.fill();}
  for(let i=0;i<Math.floor(W*H/900);i++){const x=(q()-.5)*L,y=(q()+q()+q()-1.5)*H*.16;g.fillStyle=`rgba(220,225,255,${.1+q()*.35})`;g.fillRect(x,y,.8,.8);}
  for(let i=0;i<40;i++){const x=(q()-.5)*L,y=(q()-.5)*H*.08;g.fillStyle='rgba(8,5,12,.1)';g.beginPath();g.ellipse(x,y,30+q()*80,3+q()*5,q()*.3,0,TAU);g.fill();}
  g.restore();
  // nébulosité de l'ère
  const hue=(S.era*67+200)%360;
  gr=g.createRadialGradient(cx,cy,0,cx,cy,ORB*2);gr.addColorStop(0,`hsla(${hue},60%,30%,.12)`);gr.addColorStop(1,T0);g.fillStyle=gr;g.fillRect(0,0,W,H);
  // étoiles
  for(let i=0;i<Math.floor(W*H/2200);i++){const z=q(),c=['255,255,255','200,215,255','255,235,200','255,210,180'][Math.floor(q()*4)];g.fillStyle=`rgba(${c},${.25+z*.6})`;const s=z<.95?.6+z:1.8;g.fillRect(q()*W,q()*H,s,s);}
  for(let i=0;i<6;i++){const x=q()*W,y=q()*H;g.save();g.translate(x,y);g.rotate(q()*3);g.scale(1,.4);g.fillStyle=rg(g,0,0,0,6,[[0,'rgba(230,220,255,.35)'],[1,T0]]);circ(g,0,0,6);g.fill();g.restore();}
  twk=[];for(let i=0;i<24;i++)twk.push({x:q()*W,y:q()*H,p:q()*6,s:1+q()*1.2});

let coreSpr=null,coreKey=0;
function coreR(){return ORB*.055+Math.min(ORB*.06,Math.log10(1+S.total)*1.1)}
function getCore(){const CR=coreR(),k=Math.round(CR);if(coreSpr&&coreKey===k)return coreSpr;coreKey=k;
  const half=CR*3.2,px=Math.ceil(half*2*Q),c=document.createElement('canvas');c.width=c.height=px;const g=c.getContext('2d');g.scale(px/(half*2),px/(half*2));g.translate(half,half);
  bh(g,CR,22+(S.era*11)%18);coreSpr={cv:c,half};return coreSpr;}

let bodies=[],parts=[],floats=[],comets=[];
function addBody(x,y,t,vx,vy,v,shiny){
  if(bodies.length>=maxBodies(S.lv.cap))return null;
  const dx=x-cx,dy=y-cy,r=Math.hypot(dx,dy)||1;
  if(vx===undefined){const s=Math.sqrt(GM/r)*rnd(.88,1.06);vx=-dy/r*s;vy=dx/r*s;}
  const T=typeOf(t);
  const b={x,y,vx,vy,t,v:v??Math.floor(Math.random()*4),r:tierSize(t),born:performance.now(),dead:false,trail:[],
    ang:Math.random()*TAU,w:T.spin?(T.k==='spiral'?rnd(.15,.3):rnd(-2.5,2.5)):0,ph:Math.random()*TAU,
    shiny:shiny??(Math.random()<rareChance(S.lv.luck))};
  if(b.shiny&&shiny===undefined){S.shinies++;float(x,y-14,'RARE ✨','#ffd24a',1.1);}
  bodies.push(b);S.spawned++;return b;
}
function spawnAt(x,y,vx,vy){
  const dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy),m=coreR()*2.4;
  if(d<m){const a=Math.atan2(dy,dx);x=cx+Math.cos(a)*m;y=cy+Math.sin(a)*m;}
  const b=addBody(x,y,spawnTier(),vx,vy);
  if(b){burst(x,y,dustCol(b),5,50);blip(220+b.t*25,.04,'sine',.05);}else capWarn();
  return b;
}
let capT=0;
function capWarn(){const n=performance.now();if(n-capT>2500){capT=n;toast('Champ orbital saturé — fusionne ou améliore la <b>capacité</b>');}}
function randomSpawn(){const a=Math.random()*TAU,r=rnd(ORB*.45,ORB*.95);const b=addBody(cx+Math.cos(a)*r,cy+Math.sin(a)*r,spawnTier());if(b&&!eco)burst(b.x,b.y,dustCol(b),3,30);}
function dustCol(b){const k=typeOf(b.t).k;
  if(typeOf(b.t).lum)return k==='bluestar'||k==='pulsar'||k==='whitedwarf'?'200,225,255':k==='magnetar'?'230,190,255':'255,200,120';
  return {comet:'200,230,255',icemoon:'240,230,215',volcanic:'255,200,80',desert:'220,120,80',ocean:'140,190,255',terran:'140,200,160',icegiant:'150,220,240',gasgiant:'230,200,160',ringed:'235,220,180'}[k]||'190,175,160';}
function burst(x,y,c,n,sp,life=.8){if(eco)n=Math.ceil(n/2);for(let i=0;i<n;i++){const a=Math.random()*TAU,s=rnd(.2,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c,l:life,ml:life,s:rnd(.8,2.2)});}}

/* ================= économie ================= */
let combo=0,comboT=0,boosts=[];
function boostMult(){let m=1;for(const b of boosts)if(b.kind==='mult')m*=b.v;return m}
function earn(v){v=safe(v);S.money=safe(S.money+v);S.total=safe(S.total+v);S.runTotal=safe(S.runTotal+v);}
function passiveRate(){let s=0;for(const b of bodies)s+=bodyVal(b);return safe(s*.12*radMult()*globalMult());}
function merge(a,b){
  const t=a.t+1,m1=a.r*a.r,m2=b.r*b.r,M=m1+m2;
  const x=(a.x*m1+b.x*m2)/M,y=(a.y*m1+b.y*m2)/M;
  a.dead=b.dead=true;
  const dx=x-cx,dy=y-cy,r=Math.hypot(dx,dy)||1;
  const px=a.vx*m1+b.vx*m2,py=a.vy*m1+b.vy*m2;
  const dir=Math.sign(dx*py-dy*px)||1,v=Math.sqrt(GM/r);
  const shiny=a.shiny||b.shiny;
  bodies.push(Object.assign({x,y,vx:-dy/r*v*dir,vy:dx/r*v*dir,t,v:Math.floor(Math.random()*4),r:tierSize(t),born:performance.now(),dead:false,trail:[],pop:1,ph:Math.random()*TAU,shiny},
    {ang:Math.random()*TAU,w:typeOf(t).spin?(typeOf(t).k==='spiral'?.2:rnd(-2,2)):0}));
  const nb=bodies[bodies.length-1];
  combo++;comboT=2.2;S.merges++;if(combo>S.bestCombo)S.bestCombo=combo;
  const crit=Math.random()<Math.min(.5,S.sl.crit*.03);
  const gain=tierVal(t)*2*fusMult()*globalMult()*(1+combo*.15)*(crit?10:1)*(shiny?10:1);
  earn(gain);
  float(x,y-nb.r-6,(crit?'CRIT ':'')+'+'+fmt(gain),crit||shiny?'#ffd24a':'#dfe6ff',crit?1.5:1);
  burst(x,y,dustCol(nb),12+Math.min(24,t),110+t*5);
  shake=Math.min(8,shake+1+t*.12);
  blip(300*Math.pow(1.059,Math.min(combo,36))+t*8,.09,'triangle',.08);
  if(crit)blip(1320,.15,'square',.03);
  if(t>S.maxTier)S.maxTier=t;
  if(!S.discovered.includes(t)){
    S.discovered.push(t);const bonus=tierVal(t)*25*globalMult();earn(bonus);
    toast(`Découverte : <b>${tierName(t)}</b> · +${fmt(bonus)}⚡<i>${typeOf(t).d}</i>`);
    flash(.15);blip(523,.2,'sine',.08);setTimeout(()=>blip(784,.3,'sine',.08),120);
  }
}
function eat(b){
  b.dead=true;S.eaten++;
  const g=bodyVal(b)*6*eatMult()*globalMult();earn(g);
  float(cx,cy-coreR()*1.6-10,'+'+fmt(g),'#ffc68a');
  burst(b.x,b.y,'255,190,110',8,70);corePulse=1;blip(110+b.t*6,.12,'sine',.06);
}

  else if(r<.85){const g=Math.max(passiveRate()*90,S.money*.15+100);earn(g);msg=`JACKPOT ! +${fmt(g)}⚡`;}

let AC=null,master,lastBlip=0;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=S.muted?0:.6;master.connect(AC.destination);}catch(e){}}
function blip(f,d,type,v){
  if(!AC||S.muted||document.hidden)return;const n=AC.currentTime;if(n-lastBlip<.015)return;lastBlip=n;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*1.5,n+d);
  g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d+.08);o.connect(g);g.connect(master);o.start(n);o.stop(n+d+.1);
}
$('#mute').onclick=()=>{S.muted=!S.muted;$('#mute').textContent=S.muted?'🔇':'🔊';if(master)master.gain.value=S.muted?0:.6;};

let last=performance.now(),lastFrame=0,shake=0,corePulse=0,autoAcc=0,uiT=0,saveT=0,time=0,rateShown=0;
function step(dt){
  time+=dt;
  const frenzy=boosts.some(b=>b.kind==='frenzy');
  autoAcc+=S.lv.auto*.6*(frenzy?10:1)*dt;
  while(autoAcc>=1){autoAcc--;randomSpawn();}
  if(ptr.down&&!ptr.moved&&performance.now()-ptr.st>180){ptr.acc+=(6+S.lv.hold*2)*dt;while(ptr.acc>=1){ptr.acc--;spawnAt(ptr.x+rnd(-14,14),ptr.y+rnd(-14,14));}}
  const drag=.022*Math.pow(.86,S.lv.stab),CR=coreR(),mag=S.lv.mag*ORB*.9;
  for(const b of bodies){
    const dx=cx-b.x,dy=cy-b.y,r2=dx*dx+dy*dy,r=Math.sqrt(r2)||1,a=GM/Math.max(r2,400);
    b.vx+=dx/r*a*dt;b.vy+=dy/r*a*dt;b.vx*=1-drag*dt;b.vy*=1-drag*dt;
    if(r>ORB*1.45){const k=(r-ORB*1.45)*3;b.vx+=dx/r*k*dt;b.vy+=dy/r*k*dt;b.vx*=.98;b.vy*=.98;}
    if(r<CR*1.15+b.r*.4)eat(b);
  }
  const n=bodies.length;
  for(let i=0;i<n;i++){const a=bodies[i];if(a.dead)continue;
    for(let j=i+1;j<n;j++){const b=bodies[j];if(b.dead)continue;
      const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,rr=a.r+b.r;
      if(mag>0&&a.t===b.t&&d2<14400&&d2>1){const d=Math.sqrt(d2),f=mag/(d+30)*dt;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;}
      if(d2<rr*rr){
        if(a.t===b.t){merge(a,b);break;}
        const d=Math.sqrt(d2)||1,nx=dx/d,ny=dy/d,m1=a.r*a.r,m2=b.r*b.r,ov=(rr-d)/2;
        a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
        const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
        if(rv<0){const imp=-1.6*rv/(1/m1+1/m2);a.vx-=imp*nx/m1;a.vy-=imp*ny/m1;b.vx+=imp*nx/m2;b.vy+=imp*ny/m2;
          if(rv<-60&&parts.length<400)burst(a.x+nx*a.r,a.y+ny*a.r,dustCol(a.t<b.t?a:b),3,40,.5);}
      }
    }
  }
  bodies=bodies.filter(b=>!b.dead);
  const trailOn=!eco;
  for(const b of bodies){b.x+=b.vx*dt;b.y+=b.vy*dt;b.ang+=b.w*dt;
    if(trailOn){b.trail.push(b.x,b.y);if(b.trail.length>14)b.trail.splice(0,2);}else if(b.trail.length)b.trail.length=0;
    if(b.pop)b.pop=Math.max(0,b.pop-dt*3);}
  earn(passiveRate()*dt);
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
  for(const b of boosts)b.l-=dt;boosts=boosts.filter(b=>b.l>0);
  nextComet-=dt;if(nextComet<=0){spawnComet();nextComet=rnd(35,70)*Math.pow(.85,S.sl.comet);}
  for(const c of comets){c.x+=c.vx*dt;c.y+=c.vy*dt;c.l-=dt;if(c.l<=0)c.dead=true;}comets=comets.filter(c=>!c.dead);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.l-=dt;}
  parts=parts.filter(p=>p.l>0);if(parts.length>600)parts.splice(0,parts.length-600);
  for(const f of floats){f.y-=40*dt;f.l-=dt;}floats=floats.filter(f=>f.l>0);
  shake*=Math.pow(.02,dt);corePulse=Math.max(0,corePulse-dt*2.5);
}

/* ================= rendu ================= */
function drawRot(img,x,y,w,h,a,ox=w/2,oy=h/2){const c=Math.cos(a),s=Math.sin(a);ctx.setTransform(DPR*c,DPR*s,-DPR*s,DPR*c,DPR*(x+shx),DPR*(y+shy));ctx.drawImage(img,-ox,-oy,w,h);}
let shx=0,shy=0;
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bg,0,0);
  shx=shake>.3?rnd(-shake,shake):0;shy=shake>.3?rnd(-shake,shake):0;
  ctx.setTransform(DPR,0,0,DPR,DPR*shx,DPR*shy);
  if(!eco)for(const s of twk){ctx.fillStyle=`rgba(255,255,255,${.35+.45*Math.sin(time*1.7+s.p)})`;ctx.fillRect(s.x,s.y,s.s,s.s);}
  // noyau
  const cs=getCore(),cp=1+corePulse*.08;
  ctx.drawImage(cs.cv,cx-cs.half*cp,cy-cs.half*cp,cs.half*2*cp,cs.half*2*cp);
  // traînées
  if(!eco){ctx.lineCap='round';for(const b of bodies){const tr=b.trail;if(tr.length<4)continue;
    ctx.strokeStyle=`rgba(${dustCol(b)},.12)`;ctx.lineWidth=b.r*.7;ctx.beginPath();ctx.moveTo(tr[0],tr[1]);for(let i=2;i<tr.length;i+=2)ctx.lineTo(tr[i],tr[i+1]);ctx.stroke();}}
  // queues de comètes & faisceaux (additif)
  ctx.globalCompositeOperation='lighter';
  for(const b of bodies){const T=typeOf(b.t);
    if(T.tail){const dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy)||1,k=Math.min(2.2,Math.max(.5,ORB*.55/d))*b.r/9;
      drawRot(FX.tail.cv,b.x,b.y,FX.tail.L*k,FX.tail.H*k*.7,Math.atan2(dy,dx),0,FX.tail.H*k*.35);}
    if(T.beam){const k=b.r/22;drawRot(FX.beam.cv,b.x,b.y,FX.beam.L*2*k,24*k,time*(T.k==='pulsar'?5:1.5)+b.ph);}
  }
  ctx.globalCompositeOperation='source-over';
  // corps
  const now=performance.now();
  for(const b of bodies){
    const s=getSprite(b.t,b.v),age=Math.min(1,(now-b.born)/200),sc=age*(1+(b.pop||0)*.5),hw=s.half*sc;
    if(s.T.lum)ctx.globalCompositeOperation='lighter';
    if(b.w)drawRot(s.cv,b.x,b.y,hw*2,hw*2,b.ang);
    else{ctx.setTransform(DPR,0,0,DPR,DPR*shx,DPR*shy);ctx.drawImage(s.cv,b.x-hw,b.y-hw,hw*2,hw*2);}
    if(s.T.lum)ctx.globalCompositeOperation='source-over';
    if(s.T.sh){const sd=getShadow(b.r),rr=b.r*sc;drawRot(sd.cv,b.x,b.y,rr*2,rr*2,Math.atan2(b.y-cy,b.x-cx));}
    if(b.shiny){const k=(.6+.4*Math.sin(time*4+b.ph))*Math.max(1,b.r/10);drawRot(FX.spark.cv,b.x+b.r*.8,b.y-b.r*.8,14*k,14*k,time*1.5+b.ph);}
  }
  ctx.setTransform(DPR,0,0,DPR,DPR*shx,DPR*shy);
  // particules
  for(const p of parts){ctx.globalAlpha=p.l/p.ml;ctx.fillStyle=`rgb(${p.c})`;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);}
  ctx.globalAlpha=1;
  // comètes dorées
  for(const c of comets){const a=Math.atan2(-c.vy,-c.vx);
    ctx.globalCompositeOperation='lighter';drawRot(FX.tail.cv,c.x,c.y,260,50,a,0,25);drawRot(FX.tail.cv,c.x,c.y,200,40,a+.12,0,20);
    ctx.setTransform(DPR,0,0,DPR,DPR*shx,DPR*shy);
    const g=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,30);g.addColorStop(0,'#fff');g.addColorStop(.25,'rgba(255,215,110,.9)');g.addColorStop(1,T0);ctx.fillStyle=g;circ(ctx,c.x,c.y,30);ctx.fill();
    ctx.globalCompositeOperation='source-over';
    ctx.strokeStyle=`rgba(255,210,74,${.4+.4*Math.sin(time*10)})`;ctx.lineWidth=2;circ(ctx,c.x,c.y,40+4*Math.sin(time*8));ctx.stroke();
    ctx.fillStyle='#ffd24a';ctx.font='700 11px Space Grotesk';ctx.textAlign='center';ctx.fillText('TOUCHE-MOI',c.x,c.y-50);}
  // visée
  if(ptr.down&&ptr.moved){ctx.strokeStyle='rgba(124,243,255,.7)';ctx.setLineDash([6,6]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ptr.sx,ptr.sy);ctx.lineTo(ptr.sx+(ptr.x-ptr.sx)*1.6,ptr.sy+(ptr.y-ptr.sy)*1.6);ctx.stroke();ctx.setLineDash([]);
    const s=getSprite(spawnTier(),0);ctx.globalAlpha=.6;ctx.drawImage(s.cv,ptr.sx-s.half,ptr.sy-s.half,s.half*2,s.half*2);ctx.globalAlpha=1;}
  ctx.textAlign='center';
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.l*1.5);ctx.fillStyle=f.col;ctx.font=`700 ${Math.round(14*f.big)}px Space Grotesk`;ctx.fillText(f.txt,f.x,f.y);}
  ctx.globalAlpha=1;
}
function uiTick(){
  const r=passiveRate();rateShown+=(r-rateShown)*.3;
  $('#money').innerHTML=fmt(S.money)+'<small>⚡</small>';
  $('#rate').innerHTML=`<b>+${fmt(rateShown)}</b>/s · ${bodies.length}/${maxBodies(S.lv.cap)} corps`;
  $('#dust').textContent=fmt(S.dust);$('#era').textContent=S.era;
  const cm=$('#combo');
  if(combo>=3){cm.style.opacity=1;cm.textContent=`COMBO ×${combo}`+(combo>=25?' 🤯':combo>=12?' 🔥':'');cm.style.transform=`translate(-50%,-50%) scale(${1+Math.min(.6,combo*.02)})`;}else cm.style.opacity=0;
  $('#boost').innerHTML=boosts.map(b=>`<div class="bchip">${b.nm} · ${Math.ceil(b.l)}s</div>`).join('');
  render(false);
}
function loop(now){
  requestAnimationFrame(loop);
  if(eco&&now-lastFrame<32)return;
  lastFrame=now;
  const dt=Math.min(.05,(now-last)/1000);last=now;
  step(dt/2);step(dt/2);
  draw();
  uiT+=dt;if(uiT>(eco?.25:.12)){uiT=0;uiTick();}
  saveT+=dt;if(saveT>5){saveT=0;save();}
}

/* ================= démarrage ================= */
load();
eco=S.eco??(matchMedia('(pointer:coarse)').matches);
makeFX();resize();
$('#eco').classList.toggle('on',eco);$('#eco').textContent=eco?'🌿 Éco':'🌿';
addEventListener('resize',resize);
$('#mute').textContent=S.muted?'🔇':'🔊';
if(S.savedBodies){for(const[x,y,t,v,sh]of S.savedBodies)addBody(cx+x,cy+y,t,undefined,undefined,v??0,!!sh);S.spawned-=S.savedBodies.length;}
function offline(sec,showModal){
  const maxH=4+S.sl.offline*2,pct=Math.min(1,.3+S.sl.offline*.1);
  const g=safe(passiveRate()/Math.max(1,boostMult())*Math.min(sec,maxH*3600)*pct);
  if(g<=0)return;
  if(!showModal){earn(g);toast(`🌙 Pendant ton absence : +${fmt(g)}⚡`);return;}
  $('#mb').textContent='+'+fmt(g)+'⚡';
  $('#mp').textContent=`Ton système a tourné pendant ${sec>3600?(sec/3600).toFixed(1)+' h':Math.round(sec/60)+' min'} sans toi.`;
  $('#modal').style.display='grid';
  $('#mok').onclick=()=>{earn(g);$('#modal').style.display='none';audioInit();blip(523,.2,'sine',.08);};
}
const away=(Date.now()-S.t)/1000;
if(S.total>0&&away>60)offline(away,true);
if(S.total>0)hideHint();
// onglet caché : la boucle s'arrête (0 batterie), les gains sont rattrapés au retour
let hiddenAt=0;
addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();save();}else if(hiddenAt){const s=(Date.now()-hiddenAt)/1000;hiddenAt=0;last=performance.now();if(s>5)offline(s,false);}});
addEventListener('pagehide',save);
render(true);
requestAnimationFrame(t=>{last=t;loop(t)});
})();
</script>
</body>
